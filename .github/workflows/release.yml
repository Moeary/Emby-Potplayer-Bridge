name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.7.2"
        required: true
        default: "v0.7.2"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Install locked environment
        run: pixi install --locked

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH: $tag"
          }
          $version = $tag.Substring(1)
          $manifest = Get-Content -Raw -LiteralPath 'src/chrome-extension/manifest.json' | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "src/chrome-extension/manifest.json version ($($manifest.version)) does not match $tag"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Run tests
        run: pixi run test

      - name: Build Windows Native Host and extension
        run: pixi run build

      - name: Package release files
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $hostExe = Join-Path $env:GITHUB_WORKSPACE 'dist/native-host/PotPlayerBridgeHost.exe'
          $extensionDir = Join-Path $env:GITHUB_WORKSPACE 'dist/extension'
          if (!(Test-Path -LiteralPath $hostExe)) {
            throw "Missing build output: $hostExe"
          }
          if (!(Test-Path -LiteralPath (Join-Path $extensionDir 'manifest.json'))) {
            throw "Missing extension output: $extensionDir"
          }

          Copy-Item -LiteralPath $hostExe -Destination (Join-Path $releaseDir "PotPlayerBridgeHost-$env:RELEASE_VERSION.exe")
          Compress-Archive -Path $extensionDir -DestinationPath (Join-Path $releaseDir "EmbyPotPlayerBridge-$env:RELEASE_VERSION-extension.zip") -Force
          if (Test-Path -LiteralPath 'config.toml') {
            Copy-Item -LiteralPath 'config.toml' -Destination (Join-Path $releaseDir 'config.toml')
          } else {
            Set-Content -Encoding ascii -Value '' -LiteralPath (Join-Path $releaseDir 'config.toml')
          }

          Get-ChildItem -LiteralPath $releaseDir -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Encoding ascii -LiteralPath (Join-Path $releaseDir 'SHA256SUMS.txt')

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: emby-potplayer-bridge-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Emby/Jellyfin PotPlayer Bridge ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release/PotPlayerBridgeHost-${{ env.RELEASE_VERSION }}.exe
            release/EmbyPotPlayerBridge-${{ env.RELEASE_VERSION }}-extension.zip
            release/config.toml
            release/SHA256SUMS.txt
